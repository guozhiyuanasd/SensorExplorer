image: openjdk:17

stages:
  - build

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

build_debug_apk:
  stage: build
  script:
    - apt-get update -qq && apt-get install -y -qq curl unzip
    # 安装 Android 命令行工具
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
    - unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0"
    # 安装 Gradle 并构建 debug APK
    - curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
    - unzip -q gradle.zip
    - export PATH="$PWD/gradle-8.9/bin:$PATH"
    - gradle assembleDebug --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/debug/
    expire_in: 1 week
